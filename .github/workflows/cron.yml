name: Street scheduled jobs

on:
  schedule:
    # Times are UTC.
    - cron: "0 5 * * *"   # catalog sync
    - cron: "30 6 * * *"  # storefront health check
    - cron: "0 7 * * *"   # classify
    - cron: "50 12 * * *" # brand report emails (~9 AM Eastern; GitHub often runs late)
    - cron: "20 13 * * *" # alert digest (only sends when a destination is configured)
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run manually"
        required: true
        default: catalog
        type: choice
        options: [catalog, storefront-health, classify, brand-reports, alerts]

jobs:
  run-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Determine which job this run is for
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "path=${{ github.event.inputs.job }}" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.schedule }}" in
              "0 5 * * *") echo "path=catalog" >> "$GITHUB_OUTPUT" ;;
              "30 6 * * *") echo "path=storefront-health" >> "$GITHUB_OUTPUT" ;;
              "0 7 * * *") echo "path=classify" >> "$GITHUB_OUTPUT" ;;
              "50 12 * * *") echo "path=brand-reports" >> "$GITHUB_OUTPUT" ;;
              "20 13 * * *") echo "path=alerts" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - name: Call the cron endpoint
        run: |
          # The VPS this hits is resource-constrained and occasionally returns a
          # brief 503 from Traefik under load (confirmed: not an app crash --
          # the container never restarts and never even sees these requests,
          # so it's a momentary routing-layer hiccup, not a real outage).
          # Retry on transient 5xx/timeouts instead of failing the whole job.
          curl -sS -f --max-time 90 --retry 10 --retry-delay 12 --retry-max-time 300 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/cron/${{ steps.pick.outputs.path }}"
