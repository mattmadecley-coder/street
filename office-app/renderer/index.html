<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Street HQ</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">Street HQ</div>
    </header>

    <main class="layout">
      <section class="chat">
        <div id="messages" class="messages"></div>
        <form id="composer" class="composer">
          <textarea id="input" rows="1" placeholder="Tell the GM what you need..." autofocus></textarea>
          <button id="mic" class="mic-btn" type="button" title="Voice to text" aria-label="Voice to text">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2z"/></svg>
          </button>
          <button id="send" type="submit">Send</button>
        </form>
      </section>

      <aside class="sidebar">
        <div class="sidebar-title">Departments</div>
        <div id="departments" class="departments"></div>
        <div class="clock-in">
          <div class="clock-in-row">
            <span id="clockInLabel" class="clock-in-label">Clocked in</span>
            <button id="clockInToggle" class="toggle" type="button" role="switch" aria-checked="true"></button>
          </div>
          <div id="clockInDetail" class="clock-in-detail"></div>
        </div>
      </aside>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
